name: Static, unit and packaging checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Offline static/unit checks; no Make or provider access.
      - run: npm test
      # Installs only the pinned, published SDK example dependencies from the lockfile; no Make or provider access.
      - run: npm run test:sdk
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: make-custom-apps-skill
          path: dist/make-custom-apps.zip
          if-no-files-found: error
          retention-days: 14
